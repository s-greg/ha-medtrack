# Targets use an entity filter only: hassfest rejects device filters on
# targets. The UI still offers MedTrack devices (those with matching entities).
take_dose:
  target:
    entity:
      integration: medtrack
  fields:
    dose_id:
      required: false
      selector:
        text:

skip_dose:
  target:
    entity:
      integration: medtrack
  fields:
    dose_id:
      required: false
      selector:
        text:

snooze_dose:
  target:
    entity:
      integration: medtrack
  fields:
    minutes:
      required: false
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: min
          mode: box

refill:
  target:
    entity:
      integration: medtrack
  fields:
    amount:
      required: false
      selector:
        number:
          min: 0.001
          max: 100000
          step: any
          mode: box

set_stock:
  target:
    entity:
      integration: medtrack
  fields:
    amount:
      required: true
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box

undo_last:
  target:
    entity:
      integration: medtrack

get_history:
  target:
    entity:
      integration: medtrack
  fields:
    start:
      required: false
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:

get_day:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: medtrack
